# Paramètres des nœuds caméra (opossum_vision/vision_node.py).
# Un bloc par caméra ; la clé doit correspondre à f"vision_node_{cam}" du launch.
# Seuls les paramètres réellement déclarés par le nœud sont listés :
#   simulation, port, baudrate, camera_id, binary_input.

main_robot:
  vision_node_one:
    ros__parameters:
      simulation: false
      port: '/dev/jevois_cam1'   # règle udev conseillée (ex: /dev/jevois_cam_left)
      baudrate: 115200
      binary_input: true         # true = trames binaires (doit matcher le module JeVois)
      camera_id: 1

  vision_node_two:
    ros__parameters:
      simulation: false
      port: '/dev/jevois_cam2'
      baudrate: 115200
      binary_input: true
      camera_id: 2

  vision_node_three:
    ros__parameters:
      simulation: false
      port: '/dev/jevois_cam3'
      baudrate: 115200
      binary_input: true
      camera_id: 3

