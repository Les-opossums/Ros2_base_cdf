main_robot:
  comm_node:
    ros__parameters:
      protocol_config_path: "src/opossum_comm/config/eth_protocol.yaml"
      rcv_comm_topic: zync_raspi
      send_comm_topic: raspi_zync
      comm_state_topic: comm_state

      asserv_topic: asserv
      robot_data_topic: robot_data
      motion_done_topic: motion_done
      goal_position_topic: goal_position

      cards_name: ["zynq"]
      command_topic: command
      feedback_command_topic: feedback_command
      frequency: 20.
      cards:
        zynq:
          transport: 'ethernet'
          port: '/dev/ttyZynq'      # ignore si transport=ethernet, garde pour pouvoir repasser en serial facilement
          baudrate: 921600
          zynq_ip: '192.168.1.10'

second_robot:
  comm_node:
    ros__parameters:
      protocol_config_path: "src/opossum_comm/config/eth_protocol.yaml"
      rcv_comm_topic: zync_raspi
      send_comm_topic: raspi_zync
      comm_state_topic: comm_state

      asserv_topic: asserv
      robot_data_topic: robot_data
      motion_done_topic: motion_done
      goal_position_topic: goal_position

      cards_name: ["zynq"]
      command_topic: command
      feedback_command_topic: feedback_command
      frequency: 20.
      cards:
        zynq:
          transport: 'ethernet'
          port: '/dev/ttyZynq'
          baudrate: 921600
          zynq_ip: '192.168.2.10'   # IP differente du main_robot si les deux tournent en meme temps